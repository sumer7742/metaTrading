# Simple compose. Build context = backend/ (this folder).
# Frontends are pre-built and copied into ./public before `up`.
#
#   cd backend
#   docker compose up -d --build

services:
  app:
    build: .
    image: trading-platform:latest
    container_name: trading-platform
    restart: unless-stopped
    ports:
      - '80:5000'
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
