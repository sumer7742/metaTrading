# /etc/nginx/sites-available/client.zerovant.in
#
# Reverse proxy to the client SPA container (tp-client → 127.0.0.1:8081).
# Container's internal nginx handles SPA routing + asset caching; this
# layer just terminates TLS (after certbot) and forwards.

server {
  listen 80;
  listen [::]:80;
  server_name client.zerovant.in;

  client_max_body_size 16M;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
