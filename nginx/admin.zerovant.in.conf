# /etc/nginx/sites-available/admin.zerovant.in
#
# Reverse proxy to the admin SPA container (tp-admin → 127.0.0.1:8082).
# Identical shape to the client config; separate file so we can lock
# admin down later (IP allowlist, basic auth, etc.) independently.

server {
  listen 80;
  listen [::]:80;
  server_name admin.zerovant.in;

  client_max_body_size 16M;

  location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
