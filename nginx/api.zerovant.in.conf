# /etc/nginx/sites-available/api.zerovant.in
#
# Reverse proxy for the backend API + WebSocket. Certbot will inject the
# SSL block when you run `certbot --nginx -d api.zerovant.in`. Before
# certbot, this is HTTP-only on :80; after, port 80 redirects to 443.

server {
  listen 80;
  listen [::]:80;
  server_name api.zerovant.in;

  # File upload size — matches Express's 15 MB cap (KYC docs).
  client_max_body_size 16M;

  # WebSocket — needs Upgrade + long read timeout for long-lived
  # ticker / candle / orderbook streams. Path-scoped so HTTP requests
  # under /ws also work cleanly.
  location /ws {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Razorpay webhook is HMAC-signed by Razorpay; nginx just proxies.
  # Listed separately so we can change body-size or rate-limits later
  # without touching the main /api block.
  location /api/webhooks/razorpay {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything under /api.
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Root health probe — useful for `curl https://api.zerovant.in/`
  # before certbot is wired up to confirm DNS reaches this server.
  location / {
    return 200 'api.zerovant.in OK\n';
    add_header Content-Type text/plain;
  }
}
