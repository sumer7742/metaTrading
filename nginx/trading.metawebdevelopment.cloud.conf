# /etc/nginx/sites-available/trading.metawebdevelopment.cloud
#
# Single-domain reverse proxy for the trading platform.
# Path-based routing to three internal containers:
#   /api/*   → backend  (127.0.0.1:5000)
#   /ws      → backend websocket
#   /admin/* → admin SPA (127.0.0.1:8082) — Vite built with base=/admin/
#   /*       → client SPA (127.0.0.1:8081)
#
# Certbot will inject the SSL block when you run:
#   sudo certbot --nginx -d trading.metawebdevelopment.cloud
# Before certbot, this is HTTP-only on :80; after, port 80 redirects to 443.

server {
  listen 80;
  listen [::]:80;
  server_name trading.metawebdevelopment.cloud;

  # File upload size — matches Express's 15 MB cap (KYC docs).
  client_max_body_size 16M;

  # WebSocket — needs Upgrade + long read timeout for long-lived
  # ticker / candle / orderbook streams.
  location /ws {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Razorpay webhook is HMAC-signed by Razorpay; nginx just proxies.
  # Listed separately so we can change body-size or rate-limits later
  # without touching the main /api block.
  location /api/webhooks/razorpay {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything under /api.
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Admin SPA — Vite bundle built with base=/admin/ so assets resolve
  # under this prefix. The /admin (no slash) → /admin/ redirect ensures
  # the SPA's relative asset URLs work on first hit.
  location = /admin { return 301 /admin/; }
  location /admin/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client SPA — everything else.
  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
