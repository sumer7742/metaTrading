user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_tokens off;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss image/svg+xml;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # Upstream backend (container service name `backend` from docker-compose).
  upstream tp_backend {
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # ─── HTTP → HTTPS redirect ──────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;
    # ACME challenge passthrough — for Let's Encrypt cert issuance.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ─── API + WebSocket (api.yourdomain.com) ───────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 15M; # KYC uploads

    # WebSocket — /ws path. proxy_read_timeout long so persistent ticker
    # connections don't time out on the 60s default.
    location /ws {
      proxy_pass http://tp_backend/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # Razorpay webhook — public, HMAC-verified by backend itself.
    location /api/webhooks/razorpay {
      proxy_pass http://tp_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api.
    location /api/ {
      proxy_pass http://tp_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }

    location / { return 404; }
  }

  # ─── Client SPA (app.yourdomain.com) ────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/client;
    index index.html;

    # Aggressive caching for hashed assets, never for index.html.
    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|ico)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri $uri/ /index.html;
    }
  }

  # ─── Admin SPA (admin.yourdomain.com) ───────────────────────────────
  server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;

    root /var/www/admin;
    index index.html;

    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|ico)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri $uri/ /index.html;
    }
  }
}
