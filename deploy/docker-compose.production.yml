version: '3.8'

# Production-style docker-compose.
# Run with: docker compose -f deploy/docker-compose.production.yml up -d
#
# Includes:
#   - mongodb (replica set for ACID transactions)
#   - redis (for future order book caching, rate limit shared state)
#   - backend (clustered via PM2 if you want, or scale replicas)
#   - nginx (TLS terminator + reverse proxy + static client/admin)
#
# Before running:
#   1. Build client and admin: cd client && npm run build && cd ../admin && npm run build
#   2. Copy SSL certs to ./deploy/certs/ (use Let's Encrypt / Cloudflare Origin)
#   3. Set strong secrets in .env.production (NEVER commit this file)

services:
  mongodb:
    image: mongo:7
    container_name: tp-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - tp-net
    # Healthcheck waits until the replica set actually responds. The seed
    # + backend services depend on this so they don't try to connect to a
    # half-booted mongo.
    healthcheck:
      test: |
        echo 'try { rs.status().ok } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}).ok }' | mongosh --quiet
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tp-redis
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis_data:/data
    networks:
      - tp-net

  # One-shot production seed. Creates instruments, plans, and the global
  # routing setting if missing. Idempotent — safe to run on every `up`.
  # Exits 0 on success; backend waits for that exit before starting.
  #
  # Does NOT create users (admin or trader). After first deploy you sign
  # up via the client, then promote yourself in mongosh:
  #   docker exec -it tp-mongo mongosh trading_platform --eval \
  #     'db.users.updateOne({email:"you@yourdomain.com"},
  #     {$set:{role:"SUPER_ADMIN",isActive:true,kycStatus:"APPROVED",isEmailVerified:true}})'
  seed:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tp-seed
    restart: 'no' # Run once, exit. Don't loop.
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/trading_platform?replicaSet=rs0
    networks:
      - tp-net
    command: ['node', 'src/utils/seedProd.js']

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tp-backend
    restart: unless-stopped
    # Backend starts only after seed has run AND completed successfully.
    # If seed fails (e.g. bad MONGODB_URI), backend doesn't start either —
    # surfaces the misconfig immediately rather than booting into a half-
    # seeded DB.
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      seed:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/trading_platform?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    networks:
      - tp-net
    expose:
      - '5000'
    # Resource limits for safety
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  nginx:
    image: nginx:1.25-alpine
    container_name: tp-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../client/dist:/var/www/client:ro
      - ../admin/dist:/var/www/admin:ro
    networks:
      - tp-net

networks:
  tp-net:

volumes:
  mongo_data:
  redis_data:
