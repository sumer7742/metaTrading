# In-container nginx for the client SPA. The host nginx (TLS terminator)
# proxies to this on port 80. We only need:
#   - static file serving with sensible cache headers
#   - SPA fallback so React Router deep links don't 404 on refresh
#
# Host nginx handles HSTS / CSP / gzip / TLS — keep this minimal.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed Vite assets — cache aggressively, they're content-addressed.
  location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routes — every unknown path returns index.html so React Router
  # can handle it client-side. Without this, refreshing /trade or /wallet
  # would 404.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
