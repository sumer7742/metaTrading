name: CI

# Runs on every push / PR to main:
#   1. Backend module-load smoke test (catches bad imports / circular deps)
#   2. Routing logic test (testRouting.js — 12 scenarios)
#   3. Client + admin Vite builds
#
# DB-dependent tests (testCharts.js, checkInstruments.js) are NOT run in
# CI because they need a populated Mongo. Run those manually pre-deploy
# against the staging DB.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Module load (32 core modules)
        working-directory: backend
        run: |
          node -e "
            const mods = [
              './src/services/orderRouter.service',
              './src/services/internalExecution.service',
              './src/services/lpExecution.service',
              './src/services/riskEngine.service',
              './src/adapters/lp',
              './src/controllers/orderController',
              './src/controllers/adminController',
              './src/controllers/walletController',
              './src/routes/admin',
              './src/routes/trading',
              './src/routes/wallet',
              './src/services/backgroundWorker',
              './src/matching-engine/MatchingEngine',
            ];
            for (const m of mods) require(m);
            console.log('OK');
          "
      - name: Routing logic tests
        working-directory: backend
        run: node src/utils/testRouting.js

  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install
        working-directory: admin
        run: npm ci
      - name: Build
        working-directory: admin
        run: npm run build
