# Production-style compose for self-hosted EC2 deploy.
#
# Four containers:
#   mongo    : MongoDB 7, internal-only (no public port)
#   backend  : Node API + WebSocket on internal port 5000
#   client   : nginx serving the user SPA bundle on internal port 80
#   admin    : nginx serving the admin SPA bundle on internal port 80
#
# Each container binds to 127.0.0.1:<host-port> ONLY (or no port at all
# for mongo) — so only the host's nginx (TLS terminator) can reach them.
# No port is exposed to the internet directly; the EC2 security group
# only needs 80 + 443 + 22.
services:
  mongo:
    image: mongo:7
    container_name: tp-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-backups:/backups
    # No `ports:` block — Mongo is only reachable on the internal
    # compose network. Backend connects via hostname `mongo:27017`.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    image: tp-backend:latest
    container_name: tp-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: https://trading.metawebdevelopment.cloud/api
        VITE_WS_URL: wss://trading.metawebdevelopment.cloud/ws
    image: tp-client:latest
    container_name: tp-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: https://trading.metawebdevelopment.cloud/api
        VITE_BASE: /admin/
    image: tp-admin:latest
    container_name: tp-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - backend

volumes:
  mongo-data:
