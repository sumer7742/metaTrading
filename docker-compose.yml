version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: trading-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: trading_platform

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Backend, client, admin all containerised. Use `docker compose --profile full up`
  # for end-to-end, or `docker compose up mongodb redis` for just infra (run
  # apps via `npm run dev` on host during active development).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/trading_platform
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
    ports:
      - '5000:5000'
    profiles:
      - full

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:5000
    container_name: trading-client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'
    profiles:
      - full

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:5000
    container_name: trading-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5174:80'
    profiles:
      - full

volumes:
  mongo_data:
  redis_data:
